name: "[PROD] deploy"

on: 
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: prod
      project_name: "vojolabs-project"
      aws-assume-role-arn: "arn:aws:iam::910972978278:role/<role_name>"
      aws-region: "sa-east-1"
